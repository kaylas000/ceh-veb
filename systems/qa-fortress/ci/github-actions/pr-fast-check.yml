name: Fast Checks
on: [pull_request]
jobs:
  syntax-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: npx eslint . --max-warnings=0
      - run: npx stylelint "**/*.css"
      - run: npx tsc --noEmit
      - run: npm run test:unit -- --coverage
