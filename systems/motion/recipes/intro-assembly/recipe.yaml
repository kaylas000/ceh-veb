use_when: Первый экран студии или премьеры; реплей — только по явному запросу из шапки.
dont_combine_with: [scramble-decode поверх того же слова, автозвук, второй интро на странице]
max_per_page: 1
snippet: snippet.js
demo: demo.html
mined_from: ЦЕХ · заставка студии
yield_note: Добыт из живой заставки: 3 пресета (частицы/свет/кинетика) на одном таймлайне, skip + sessionStorage, Web Audio по жесту, кино-шторки.
