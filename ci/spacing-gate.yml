# Spacing Control Gate: ни один PR с нарушениями отступов не уходит в прод.
name: Spacing Control Gate
on:
  pull_request:
    branches: [main, staging]
jobs:
  spacing-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install
      - name: Stylelint spacing check
        run: npx stylelint "**/*.css" --config .stylelintrc-spacing.js
  spacing-audit:
    runs-on: ubuntu-latest
    needs: spacing-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node ./audit/run-audit.js   # exit 1 при >20 нарушениях
